name: live_store
description: Storage of Pure Live v4 - drift database, settings registry, encrypted secrets and backups (spec/modules/store.md). Pure Dart, no Flutter.
publish_to: none
version: 0.1.0

environment:
  sdk: ^3.13.0

resolution: workspace

dependencies:
  drift: ^2.35.0
  live_core: any
  meta: ^1.19.0
  path: ^1.9.1
  pointycastle: ^4.0.0
  sqlite3: ^3.6.0

dev_dependencies:
  build_runner: ^2.16.1
  drift_dev: ^2.35.0
  test: ^1.32.0
  very_good_analysis: ^11.0.0
