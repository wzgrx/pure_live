name: sign-android-release

# Signs Android APKs built locally (GitHub Actions only signs; the build
# runs on the maintainer's machine). The staged APKs are uploaded to the
# release as `staged-*.apk`; this job re-signs them with the release key
# kept in the repository secrets, checks the certificate, uploads the
# signed APKs with SHA256SUMS.txt and deletes the staged ones.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag, for example v4.0.0
        required: true
        type: string
      target_sha:
        description: Exact source commit the local build used
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: sign-android-release-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  sign:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ inputs.tag }}
      # The certificate 3.x was signed with: 4.x installs over it.
      EXPECTED_CERT_SHA256: c0bb95744c81f9c7dd4535a9552775038eb5a59c5922f791d1695f45ac34ceaf
      STORE_PASSWORD: ${{ secrets.PURELIVE_STORE_PASSWORD }}
      KEY_PASSWORD: ${{ secrets.PURELIVE_KEY_PASSWORD }}
      KEY_ALIAS: ${{ secrets.PURELIVE_KEY_ALIAS }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.target_sha }}

      - name: Download the staged APKs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p staged signed
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern 'staged-*.apk' --dir staged
          ls -la staged
          test "$(ls staged/*.apk | wc -l)" -ge 1

      - name: Restore the release key
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.PURELIVE_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          for name in KEYSTORE_BASE64 STORE_PASSWORD KEY_PASSWORD KEY_ALIAS; do
            test -n "${!name:-}"
          done
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"

      - name: Align, sign and verify
        shell: bash
        run: |
          set -euo pipefail
          version_name="$(sed -n 's/^version:[[:space:]]*//p' apps/pure_live/pubspec.yaml | head -n 1)"
          version_name="${version_name%%+*}"
          test "$TAG" = "v$version_name"
          tools="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          for staged in staged/staged-*.apk; do
            abi="$(basename "$staged" .apk)"
            abi="${abi#staged-}"
            out="signed/PureLive-$version_name-android-$abi.apk"
            "$tools/zipalign" -f -P 16 4 "$staged" "$RUNNER_TEMP/aligned.apk"
            "$tools/apksigner" sign \
              --ks "$RUNNER_TEMP/release.jks" --ks-key-alias "$KEY_ALIAS" \
              --ks-pass env:STORE_PASSWORD --key-pass env:KEY_PASSWORD \
              --v1-signing-enabled true --v2-signing-enabled true --v3-signing-enabled true \
              --out "$out" "$RUNNER_TEMP/aligned.apk"
            "$tools/zipalign" -c -P 16 4 "$out"
            cert="$("$tools/apksigner" verify --print-certs "$out" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | head -n 1)"
            echo "$out $cert"
            test "$cert" = "$EXPECTED_CERT_SHA256"
          done
          rm -f "$RUNNER_TEMP/release.jks" "$RUNNER_TEMP/aligned.apk"
          (cd signed && sha256sum PureLive-*.apk > SHA256SUMS.txt && cat SHA256SUMS.txt)

      - name: Publish the signed APKs
        shell: bash
        run: |
          set -euo pipefail
          gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" --clobber signed/PureLive-*.apk signed/SHA256SUMS.txt
          for staged in staged/staged-*.apk; do
            gh release delete-asset "$TAG" "$(basename "$staged")" --repo "$GITHUB_REPOSITORY" --yes
          done
