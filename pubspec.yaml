# Pure Live workspace (docs/PLAN.md §3). Members are added one refactored
# module at a time and share this directory's pubspec.lock. Dependency
# overrides may only be declared here.
name: pure_live_workspace
publish_to: none

environment:
  sdk: ^3.13.0

workspace:
  - apps/pure_live
  - packages/live_cast
  - packages/live_core
  - packages/live_danmaku
  - packages/live_iptv
  - packages/live_media
  - packages/live_net
  - packages/live_player
  - packages/live_record
  - packages/live_store
  - packages/live_ui
  - tools/check_latest

# Overrides apply to the whole workspace and may only be declared here.
dependency_overrides:
  # Self-maintained fork of Predidit/media-kit (toolchain.env pins the
  # upstream commit; patches in third_party/media_kit_video/PURELIVE_PATCH.md).
  media_kit:
    path: third_party/media_kit
  media_kit_video:
    path: third_party/media_kit_video
  # The fork pins these below their latest stable releases (media_kit: xml
  # ^6.5.0; media_kit_video: wakelock_plus 1.3.3) but only uses APIs that are
  # unchanged in the latest ones (XmlDocument in the Apple hook;
  # WakelockPlus.enable/disable).
  wakelock_plus: 1.8.1
  xml: 7.1.0
  # Flutter 3.47.5's flutter_test pins test_api 0.7.12, below what test 1.32.0
  # (the pure Dart members) needs; flutter_test runs on 0.7.14 (live_ui's tests).
  test_api: 0.7.14
  # ffmpeg_kit_extended_flutter 0.6.2 (the recorder's FFmpeg) declares
  # code_assets ^1.2.1 while the media_kit fork needs ^2.1.0; its build hook
  # only uses APIs unchanged in 2.x (3.x shipped the same override).
  code_assets: 2.1.0

# Native FFmpeg of the recorder (apps/pure_live depends on
# ffmpeg_kit_extended_flutter 0.6.2). The plugin's build hook reads this block
# from the pubspec next to .dart_tool/package_config.json, which in a pub
# workspace is this one. The URLs are 3.x's verified FFmpeg 9.0.2 bundles
# (release native-ffmpeg-9.0.2-b1); they are downloaded at build time and
# never committed.
ffmpeg_kit_extended_config:
  type: base
  gpl: false
  small: false
  android: https://github.com/wzgrx/pure_live/releases/download/native-ffmpeg-9.0.2-b1/bundle-base-shared-lgpl-release.aar
  windows: https://github.com/wzgrx/pure_live/releases/download/native-ffmpeg-9.0.2-b1/bundle-base-windows-x86_64-shared-lgpl.zip
  linux: https://github.com/wzgrx/pure_live/releases/download/native-ffmpeg-9.0.2-b1/bundle-base-linux-x86_64-shared-lgpl.zip
