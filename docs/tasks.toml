# 项目任务登记表（docs v2）：docs 里所有编号、状态和进度的唯一来源。
# 加任务、改状态、记阶段都只改这里，然后运行 python3 tools/docs/docs.py 重新生成索引和进度；
# 门禁会检查生成的文件是不是最新。字段的含义见 docs/PROCESS.md 第 3 节。

[[group]]
id = "A"
title = "界面设计"
scope = "所有看得见的：设计系统、组件、动效和手感、尺寸适配、无障碍，以及每个区域、每个客户端的界面设计和它的实现。界面优先，排第一。"

[[group]]
id = "C"
title = "直播间"
scope = "直播间的功能和逻辑：进房、房间控制器、播放接入、小窗和后台播放、菜单里的工具。界面在 A07。"

[[group]]
id = "D"
title = "弹幕"
scope = "各平台的弹幕协议、过滤和屏蔽、飞行弹幕引擎、数据流和性能、弹幕设置。界面在 A08。"

[[group]]
id = "E"
title = "直播平台"
scope = "35 个来源（33 个 v3 平台、Kick、网络电视）的播放地址、搜索、分区、关注刷新、链接解析和平台框架。"

[[group]]
id = "G"
title = "播放"
scope = "mpv 播放引擎、播放会话和恢复、起播速度和弱网、画面、声音和媒体控制。"

[[group]]
id = "H"
title = "录制"
scope = "录制核心、录制中心、录制设置和存储、自动录制、录制通知。界面在 A10。"

[[group]]
id = "I"
title = "浏览和发现"
scope = "首页外壳和全局、热门、分区、关注、搜索、观看历史、标签和分组、小页面的功能和逻辑。界面在 A06、A09、A15。"

[[group]]
id = "J"
title = "设置和数据"
scope = "设置、存储和加密、备份恢复、WebDAV、设备同步、3.x 数据迁移。界面在 A11、A12。"

[[group]]
id = "K"
title = "账号和登录"
scope = "各平台账号和登录方式、登录状态、第三方认证。界面在 A12。"

[[group]]
id = "L"
title = "网络电视和点播"
scope = "网络电视（订阅源、导入、管理）、节目单和回看、点播和音乐。界面在 A13、A17。"

[[group]]
id = "N"
title = "多画面和投屏"
scope = "多画面和投屏的功能。界面在 A13。"

[[group]]
id = "O"
title = "Android系统集成"
scope = "Android 原生部分：通知和前台服务、画中画、分享接收、权限、方向和刷新率、返回手势。"

[[group]]
id = "Q"
title = "网络和代理"
scope = "HTTP 和 WebSocket、请求头、压缩、代理和镜像、原生 HTTP 通道、网络状态。"

[[group]]
id = "R"
title = "性能和流畅度"
scope = "基准和测量、刷新率、内存、启动速度、耗电。手感在 A03，尺寸适配在 A04。"

[[group]]
id = "S"
title = "质量和验证"
scope = "自动测试、真机验证、统一验证、覆盖安装 3.x 验证。"

[[group]]
id = "V"
title = "需求和反馈"
scope = "新功能从这里提出和评估，用户反馈和 issue、审查和调研的发现也从这里进来；采纳后在目标组开任务，不做的写明原因。"

[[group]]
id = "W"
title = "上游借鉴"
scope = "跟踪上游项目的更新，找出可以借鉴的修复和功能，对照 4.x 是否有同样的问题。"

[[group]]
id = "X"
title = "多端客户端"
scope = "Windows、Linux、电视、苹果平台的客户端专属工作（打包、原生、平台差异）；各端的界面在 A16～A18。"

