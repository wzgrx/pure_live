# Pure Live repository workspace (docs/adr/0013-legacy-folder.md).
# The archived 3.x app in legacy/ is not a member (docs/adr/0016-archive-v3.md).
# All members share this directory's pubspec.lock.
name: pure_live_workspace
publish_to: none

environment:
  sdk: ^3.13.0

workspace:
  - apps/pure_live
  - packages/live_core
  - packages/live_net
  - packages/live_store
  - packages/live_ui
  - tools/live_cli
  - tools/check_latest

# Overrides apply to the whole workspace and may only be declared here
# (docs/adr/0008-dependency-overrides.md).
dependency_overrides:
  # Self-maintained fork of Predidit/media-kit (docs/adr/0002-media-kit-fork.md).
  media_kit:
    path: third_party/media_kit
  # Flutter 3.47.5 pins these below their latest stable releases; overriding
  # keeps test, analyzer and code generators current (ADR 0008).
  _fe_analyzer_shared: 108.0.0
  analyzer: 14.4.0
  cli_util: 0.6.0
  material_color_utilities: 0.13.1
  source_gen: 4.3.0
  test_api: 0.7.14
