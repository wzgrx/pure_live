# 项目任务登记表：docs 里所有编号、状态和进度的唯一来源。
# 加任务、改状态、记阶段都只改这里，然后运行 python3 tools/docs/docs.py 重新生成索引和进度；
# 门禁会检查生成的文件是不是最新。字段的含义见 docs/PROCESS.md 第 3 节。

[[group]]
id = "T00"
title = "工程底座"
scope = "支撑全项目的工程设施：工具链和依赖、门禁、清点和归属、构建和装机、多语言、文档。"

[[sub]]
id = "T00a"
title = "工具链和依赖"
scope = "Flutter、Dart、Gradle、JDK、NDK、mpv 分支、FFmpeg 包和 pub 依赖的版本和升级检查。"
code = "`toolchain.env`、根目录 `pubspec.yaml`、`tools/check_latest/`、`third_party/`"

[[sub]]
id = "T00b"
title = "门禁"
scope = "每次推送前必须通过的检查：格式、依赖方向、分析、测试、界面结构、样本隐私、文档。"
code = "`tools/gate/`"

[[sub]]
id = "T00c"
title = "清点和归属"
scope = "保证不漏：代码文件、功能点、设置项、平台、原生插件、界面都归到某个子分类，没归的报错。"
code = "`tools/ui/inventory.py`、`tools/docs/`、`docs/inventory/`"

[[sub]]
id = "T00d"
title = "构建和装机"
scope = "测试包和正式包的构建，K90 装机、截图、前台检查等助手。"
code = "`apps/pure_live/android/` 的构建配置、`tools/ffmpeg_kit/`"

[[sub]]
id = "T00e"
title = "多语言"
scope = "中文和英文翻译、键名排序和检查、运行时拼出来的键。"
code = "`apps/pure_live/assets/translations/`、`apps/pure_live/lib/i18n/`"

[[sub]]
id = "T00f"
title = "文档"
scope = "docs 的结构、登记表、生成脚本、模板、链接检查。"
code = "`docs/`、`tools/docs/`"

[[group]]
id = "T01"
title = "设计系统和通用组件"
scope = "所有界面共用的设计系统：主题、图标、通用组件、弹窗组件、动效、无障碍。"

[[sub]]
id = "T01a"
title = "主题"
scope = "颜色角色（深浅两套、语义色、画面上的颜色）、文字、间距、圆角、阴影。"
code = "`packages/live_ui/lib/src/theme/`"

[[sub]]
id = "T01b"
title = "图标"
scope = "`AppIcons`：每个位置用的图标按用途命名。"
code = "`packages/live_ui/lib/src/icons/`"

[[sub]]
id = "T01c"
title = "通用组件"
scope = "状态页、头像、计数、二维码、标签、芯片、列表行、设置行、滚动外壳、焦点框。"
code = "`packages/live_ui/lib/src/widgets/`"

[[sub]]
