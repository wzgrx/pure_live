name: live_media
description: Playback core of Pure Live — turns play lines and input recipes into engine inputs, relays FLV and HLS locally in pure Dart, orders fallbacks and classifies player errors.
publish_to: none
version: 0.1.0

environment:
  sdk: ^3.13.0

resolution: workspace

dependencies:
  clock: ^1.1.3
  live_core: any
  live_net: any
  meta: ^1.19.0

dev_dependencies:
  fake_async: ^1.3.3
  test: ^1.32.0
  very_good_analysis: ^11.0.0
