name: CI

# Manual only (docs/adr/0014-v4-first.md): Actions minutes are used up and hosted
# runners are slow, so the required gate runs locally before every push:
#   bash tools/gate/gate.sh --all
# This workflow runs the same command on demand.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    name: Gate (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Read pinned toolchain
        run: grep -E '^[A-Z_]+=' toolchain.env >> "$GITHUB_ENV"

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.x"

      - name: Install tool test dependencies
        run: python -m pip install pyyaml==6.0.3

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Resolve locked workspace
        run: flutter pub get --enforce-lockfile

      - name: Gate
        run: bash tools/gate/gate.sh --all
        env:
          GATE_TEST_CONCURRENCY: "4"
