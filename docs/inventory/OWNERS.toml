# 归属表：每个代码文件、设置、来源、原生通道归哪个子分类管（Z03.2）。
#
# 手写；`python3 tools/docs/owners.py` 核对并生成 OWNERS.md，门禁的 `owners` 一步
# 跑 `--check`。子分类编号必须在 docs/tasks.toml 的 [[sub]] 里。
#
# 怎么分（2026-10-08 第一版，冲突和拿不准的见 Z03.2 的 record.md）：
# - 一个文件只有一个归属：改它最多、对它负责的子分类。
# - 界面（页面、组件）归 A 组的界面子分类，逻辑、数据和平台代码归功能子分类
#   （组说明“界面在 A07”这类写法）。先按目录写，混在一起的目录再按文件写例外，
#   例外写在目录规则前面（第一条匹配的生效）。
# - 路径从仓库根目录写；`**` 任意层目录，`*`、`?` 只在一层名字里，结尾的 `/`
#   表示目录下的全部文件。一条规则一个文件都没匹配到（文件删了或被前面的规则
#   全部拿走）也报错，所以删文件时一并删规则。
# - 加新文件时：落在已有目录规则下就不用改；新目录或者归属不同时加一条。

