name: flutter_inappwebview_linux
description: >-
  PureLive's stand-in for flutter_inappwebview's Linux implementation: no
  native code, so the Linux build does not need WPE WebKit. The app has no
  in-app browser on Linux (InAppWeb.available is false there; X02.1).
version: 0.1.0-beta.1
publish_to: none

environment:
  sdk: ^3.13.0
  flutter: ">=3.47.0"

dependencies:
  flutter:
    sdk: flutter

flutter:
  plugin:
    implements: flutter_inappwebview
    platforms:
      linux:
        dartPluginClass: LinuxInAppWebViewPlatform
