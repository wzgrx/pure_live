include: package:very_good_analysis/analysis_options.yaml

analyzer:
  exclude:
    # drift_dev output (lib/**/*.g.dart and the schema helpers of test/drift/).
    - "**/*.g.dart"
    - test/drift/*/generated/**

formatter:
  page_width: 120

linter:
  rules:
    lines_longer_than_80_chars: false
    public_member_api_docs: true
