name: Weekly latest-version check

# spec/constitution.md, rule 3: toolchain, forks and dependencies track the latest
# official stable releases. Reports what is behind; upgrades go through the gate.
on:
  schedule:
    - cron: "17 2 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-latest:
    name: check_latest report
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Read pinned toolchain
        run: grep -E '^[A-Z_]+=' toolchain.env >> "$GITHUB_ENV"

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Resolve locked workspace
        run: flutter pub get --enforce-lockfile

      - name: Compare with the latest official releases
        run: dart run tools/check_latest/bin/check_latest.dart --root . --report-only >> "$GITHUB_STEP_SUMMARY"
        env:
          GITHUB_TOKEN: ${{ github.token }}
