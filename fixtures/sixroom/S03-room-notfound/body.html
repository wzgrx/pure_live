.reclist {
    display: flex;
    margin-top: 38px;
    margin-bottom: 30px;
}
.reclist li{
    box-sizing: border-box;
    padding: 0 10px;
    width: 20%;
}
.reclist .pic{
    position: relative;
    width: 100%;
    height: 180px;
    border-radius: 8px;
    overflow: hidden;
}
.reclist .pic a{
    display: block;
    width: 100%;
    height: 100%;
}
.reclist .pic img{
    position: absolute;
    top: 0;
    left: 50%;
    width: auto;
    height: 100%;
    transform: translateX(-50%);
    transition: transform 0.3s ease-in-out;
}
.reclist .pic a:hover img{
    transform: translateX(-50%) scale(1.2);
}
.reclist .pic .mask{
    position: absolute;
    left: 0;
    bottom: 0;
    width: 100%;
    height: 30px;
    background: linear-gradient(to bottom, rgba(0, 0, 0, 0) 5%, rgba(0, 0, 0, 0.25) 50%, rgba(0, 0, 0, 0.6) 100%);
}
.reclist .pic .count{
    position: absolute;
    z-index: 3;
    right: 6px;
    bottom: 4px;
    height: 17px;
    line-height: 17px;
    font-size: 12px;
    color: #fff;
}
.reclist .name{

<script>
    var $ = jQuery;
    var timeBox = document.querySelector('.countdown');
    var time = 5;
    var setTime = function(sec){
        timeBox.innerHTML = sec+'s';
    }
    var timer = setInterval(function(){
        time--;
        setTime(Math.max(time, 0));
        if(time <= 0){
            clearInterval(timer);
            location.href = 'https://v.6.cn';
        }
    }, 1000);
    setTime(time);

    jQuery(function($){
        $.ajax({
            url : 'https://v.6.cn/coop/pub/getRand.php?num=5',
            dataType : 'jsonp',
            success : function(result) {
                var fragment = document.createDocumentFragment();
                $.each(result, function(i){
                    var item = result[i];
                    var li = jQuery('<li>\
						<p class="pic"><a href="https://v.6.cn/'+item.rid+'">\
							<img src="'+item.pic+'" alt="'+item.username+'"/>\
							<span class="mask"></span>\
							<span class="count">'+item.count+'人观看</span>\
						</a></p>\
						<div class="info">\
							<p class="name"><a href="https://v.6.cn/'+item.rid+'">'+item.username+'</a></p>\
							<p class="time">开播:'+item.starttime+'</p>\
						</div>\
					</li>');
                    fragment.appendChild(li[0]);
                });
                $(".recommend ul").append(fragment.childNodes);
            }
        });
    });

    var insertScript = function (url) {
        var script = document.createElement('script');
        var head = document.getElementsByTagName('head')[0];
        script.type = 'text/javascript';
        script.src = url;
        head.insertBefore(script, head.firstChild);
    };

    var getUid = function () {
        var result = '0';
        var vinfo = $.cookie('_vinfo');
        var coin6 = $.cookie('_coin6');
        var ticket = $.cookie('ticket_v');
        if (ticket && vinfo && vinfo != 'deleted' && coin6) {
            result = coin6.split(':')[0];
        }
        return result;
    };

    window['_jiadelee_'] = function(data) {
        var _reft = data.r || 0;
        var _reftCK = $.cookie('shrek_reft');
        if (_reftCK) {
            _reftCK = _reftCK.split('|');
            if (_reftCK[1] == data.t) {
                _reft = _reftCK[0];
            }
        }

        $.cookie('shrek_reft', _reft + '|' + data.t, {
            domain: '6.cn',
            expires: new Date(new Date().getTime() + 30 * 24 * 60 * 60 * 1000)
        });
    };

    var toLance = function () {
        var LANCE_API = 'https://shrek.6.cn/live.6.cn/e6u2/rp.php';
        var href = location.href.replace(/^https?\:\/\//, '');
        var referrer = (document.referrer || '').replace(/^https?\:\/\//, '');
        var userAgent = navigator.userAgent.toLowerCase();
        var screen = window.screen;

        insertScript(LANCE_API 
            + '?location=' + encodeURIComponent(href)
            + '&referer=' + encodeURIComponent(referrer)
            + '&browser=' + encodeURIComponent(userAgent)
            + '&msr=' + encodeURIComponent(screen.width + ',' + screen.height) 
            + '&uid=' + getUid()
            + '&pro=4' 
            + '&stamp=' + new Date().getTime()
        );
    }
    toLance();
</script>
