# Interface text (spec/product.md F-APP-06, docs/adr/draft-i18n.md).
# Sources: lib/i18n/<locale>/<namespace>.i18n.json; regenerate with
#   dart run slang
# and commit lib/i18n/strings*.g.dart. test/i18n_test.dart fails when a
# locale misses a key, has an empty value or a different placeholder set.
base_locale: zh-Hans
fallback_strategy: none
input_directory: lib/i18n
input_file_pattern: .i18n.json
output_directory: lib/i18n
output_file_name: strings.g.dart
namespaces: true
lazy: false
translate_var: t
enum_name: AppLocale
class_name: Translations
string_interpolation: braces
flat_map: false
timestamp: false
statistics: false
format:
  enabled: true
  width: 120
