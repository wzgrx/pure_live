name: live_ui
description: Design system of Pure Live v4 (spec/design/principles.md) - theme tokens, window classes, adaptive navigation and shared components.
publish_to: none
version: 0.1.0

environment:
  sdk: ^3.13.0

resolution: workspace

dependencies:
  flutter:
    sdk: flutter
  # The icons (principles §2.6): Material Symbols Rounded, a variable font
  # (FILL, wght, GRAD, opsz); only the Rounded glyphs are used, and release
  # builds keep only the glyphs the app names.
  material_symbols_icons: ^4.2960.0
  # Draws the empty-state and error illustrations (principles §3.3).
  vector_graphics: ^1.2.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  # Compiles assets/illustrations/*.svg when assets are built (tests too).
  vector_graphics_compiler: ^1.3.0
  very_good_analysis: ^11.0.0

flutter:
  assets:
    - assets/platforms/
    # principles §3.3: SVG compiled to vector_graphics binaries at build
    # time, never parsed at run time.
    - path: assets/illustrations/
      transformers:
        - package: vector_graphics_compiler
