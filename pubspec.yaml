# Pure Live repository workspace (docs/adr/0013-legacy-folder.md).
# The legacy 3.x app lives in legacy/; v4 packages and tools are members too.
# All members share this directory's pubspec.lock.
name: pure_live_workspace
publish_to: none

environment:
  sdk: ^3.13.0

workspace:
  - legacy
  - packages/live_core
  - packages/live_net
  - packages/live_ui
  - tools/live_cli
  - tools/check_latest

# Overrides apply to the whole workspace and may only be declared here
# (docs/adr/0008-dependency-overrides.md).
dependency_overrides:
  media_kit:
    path: third_party/media_kit
  fvp:
    path: third_party/fvp
  # Keep the full dependency graph at current stable releases while upstream
  # packages and Flutter SDK pins are migrated and regression-tested here.
  _fe_analyzer_shared: 108.0.0
  analyzer: 14.4.0
  cli_util: 0.6.0
  dbus: 0.8.0
  file_picker_linux: 2.0.1
  material_color_utilities: 0.13.1
  nm: 0.6.0
  source_gen: 4.3.0
  test_api: 0.7.14
  flutter_inappwebview_android:
    path: legacy/plugins/built_in_kotlin/flutter_inappwebview_android # 上游网页内核Android子包ProGuard兼容补丁
  share_handler_android:
    path: legacy/plugins/built_in_kotlin/share_handler_android # share_handler Android本地兼容补丁
  hooks: ^2.2.0 # Native Assets 构建 hooks 兼容
  code_assets: ^2.1.0 # media_kit Native Assets 2 and FFmpeg hook compatibility
  xml: ^7.0.1 # webdav_client xml7兼容
  wakelock_plus: ^1.4.0 # media_kit声明版本覆盖
  screen_retriever:
    git:
      url: https://github.com/liuchuancong/screen_retriever.git
      path: ./packages/screen_retriever
      ref: b246b3963738d6cc159c921764c194c73dbdf2ad

# FFmpeg bundles for the legacy app's ffmpeg_kit_extended_flutter. Its build hook
# reads this key only from the pubspec next to .dart_tool/package_config.json,
# which in a workspace is this file, not legacy/pubspec.yaml. Without it the
# hook silently falls back to the package's default small build.
ffmpeg_kit_extended_config:
  type: base
  gpl: false
  small: false
  android: https://github.com/wzgrx/pure_live/releases/download/native-ffmpeg-9.0.2-b1/bundle-base-shared-lgpl-release.aar
  windows: https://github.com/wzgrx/pure_live/releases/download/native-ffmpeg-9.0.2-b1/bundle-base-windows-x86_64-shared-lgpl.zip
  linux: https://github.com/wzgrx/pure_live/releases/download/native-ffmpeg-9.0.2-b1/bundle-base-linux-x86_64-shared-lgpl.zip
  macos: https://github.com/wzgrx/pure_live/releases/download/native-ffmpeg-9.0.2-b1/bundle-base-macos-universal-lgpl.xcframework.zip
  ios: https://github.com/wzgrx/pure_live/releases/download/native-ffmpeg-9.0.2-b1/bundle-base-ios-universal-lgpl.xcframework.zip
