name: CI

# v4 gate on every push to master and every pull request (docs/rewrite/PLAN.md, phase 3).
# Runs tools/gate/gate.sh --all: dependency direction, format/analyze/tests for every
# v4 workspace member, the legacy app's analyze and tests (legacy/, ADR 0013), and the tool tests.
on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    name: Gate (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Read pinned toolchain
        run: grep -E '^[A-Z_]+=' toolchain.env >> "$GITHUB_ENV"

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.x"

      - name: Install tool test dependencies
        run: python -m pip install pyyaml==6.0.3

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Resolve locked workspace
        run: flutter pub get --enforce-lockfile

      - name: Gate
        run: bash tools/gate/gate.sh --all
        env:
          GATE_TEST_CONCURRENCY: "4"
